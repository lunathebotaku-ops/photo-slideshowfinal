<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo a Day</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      padding: 16px;
    }

    .slideshow-card {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.04);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .slideshow-card:hover {
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.12);
    }

    .image-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5; /* Aesthetic portrait aspect ratio */
      overflow: hidden;
      background-color: #f7f7f7;
    }

    .slide {
      display: none;
      width: 100%;
      height: 100%;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Minimal Floating Controls */
    .nav-btn {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      color: #222222;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      user-select: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }

    .nav-btn.prev { left: 14px; }
    .nav-btn.next { right: 14px; }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-50%) scale(1.08);
    }

    /* Aesthetic Date Caption */
    .slide-caption {
      text-align: center;
      padding: 14px 18px;
      font-size: 13px;
      font-weight: 500;
      color: #666666;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: #ffffff;
      border-top: 1px solid rgba(0, 0, 0, 0.03);
    }

    /* Soft Fade Transition */
    .fade {
      animation: softFade 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes softFade {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="slideshow-card">
  <div class="image-frame">
    <!-- Day 1 -->
    <div class="slide fade">
      <img src="https://lh3.googleusercontent.com/d/1RLV3oFn3op_qL8bjkE9cnZAO6jt0FOrA" alt="Day 1">
      <div class="slide-caption">Day 1 — November 12, 2026</div>
    </div>

    <!-- Day 2 (Template for next day) -->
    <div class="slide fade">
      <img src="https://lh3.googleusercontent.com/d/1VwU_PsA1bLX5vGc5xEdYDkuX2vsPz4Vh" alt="Day 2">
      <div class="slide-caption">Day 2 — November 13, 2026</div>
    </div>

    <!-- Floating Navigation Arrows -->
    <div class="nav-btn prev" onclick="plusSlides(-1)">&#10094;</div>
    <div class="nav-btn next" onclick="plusSlides(1)">&#10095;</div>
  </div>
</div>

<script>
  let slideIndex = 1;
  showSlides(slideIndex);

  function plusSlides(n) {
    showSlides(slideIndex += n);
  }

  function showSlides(n) {
    let slides = document.getElementsByClassName("slide");
    if (n > slides.length) { slideIndex = 1; }
    if (n < 1) { slideIndex = slides.length; }
    for (let i = 0; i < slides.length; i++) {
      slides[i].style.display = "none";  
    }
    slides[slideIndex - 1].style.display = "block";  
  }
</script>

</body>
</html>
